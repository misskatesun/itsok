<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>💖放過自己、愛自己💖 提醒小卡生產器</title>
    <meta property="og:title" content="💖放過自己、愛自己💖 提醒小卡生產器">
    <meta property="og:description" content="寫下你覺得自己做得不夠好的部分，一鍵生成專屬療癒提醒小卡！">
    <meta property="og:type" content="website">

    <!-- html2canvas 用於生成圖卡 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-bg: #0b0c1b;
            --card-bg: rgba(25, 23, 48, 0.75);
            --pink-glow: #ff7ebb;
            --purple-glow: #a88beb;
            --text-color: #f0f3ff;
            --accent-pink: #ff60a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #090a15 0%, #17122b 50%, #0d0c1d 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 126, 187, 0.25);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 126, 187, 0.15);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: 0 0 10px var(--pink-glow);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: #d1c4e9;
            font-weight: bold;
        }

        .sub-label {
            font-size: 0.85rem;
            color: #b0a8b9;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(168, 139, 235, 0.4);
            background: rgba(10, 10, 25, 0.6);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        textarea {
            height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--pink-glow);
            box-shadow: 0 0 10px rgba(255, 126, 187, 0.4);
        }

        /* 性別稱呼單選框樣式 */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            color: #f0f3ff;
        }

        .radio-label input[type="radio"] {
            margin-right: 6px;
            accent-color: var(--pink-glow);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            background: linear-gradient(135deg, #a88beb 0%, #ff60a8 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 96, 168, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 96, 168, 0.6);
        }

        /* 生成的小卡區域 */
        #card-capture {
            display: none;
            background: linear-gradient(180deg, #181530 0%, #0d0b1a 100%);
            border: 2px solid var(--pink-glow);
            border-radius: 20px;
            padding: 25px 20px;
            margin-top: 25px;
            box-shadow: 0 0 25px rgba(255, 126, 187, 0.3);
            text-align: center;
        }

        .card-content {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #ffffff;
            word-break: break-word;
        }

        .card-praise {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 1.1rem;
            color: #ff9ebb;
            font-weight: 600;
            line-height: 1.6;
        }

        .card-img-box {
            margin-top: 20px;
        }

        .card-img-box img {
            width: 100%;
            max-width: 320px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(168, 139, 235, 0.4);
        }

        .card-img-caption {
            font-size: 0.9rem;
            color: #d1c4e9;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* 📸 生成分享圖片 按鈕樣式 */
        .download-action-box {
            margin-top: 25px;
            text-align: center;
        }

        .btn-generate-image {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 126, 187, 0.15);
            border: 1px solid var(--pink-glow);
            color: #ff7ebb;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 126, 187, 0.2);
        }

        .btn-generate-image:hover {
            background: var(--pink-glow);
            color: #100d21;
            box-shadow: 0 0 18px rgba(255, 126, 187, 0.6);
            transform: translateY(-2px);
        }

        /* 社群與捐款區塊 */
        .social-links {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .social-links a {
            text-decoration: none;
            color: #e0d7ff;
            font-size: 0.85rem;
            padding: 8px 12px;
            border: 1px solid rgba(168, 139, 235, 0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.2s;
            display: inline-block;
            margin: 4px;
        }

        .social-links a:hover {
            background: var(--purple-glow);
            color: white;
            box-shadow: 0 0 10px var(--purple-glow);
        }

        .support-btn {
            margin-top: 12px;
        }

        .support-btn a {
            text-decoration: none;
            color: white;
            font-size: 0.85rem;
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(255, 96, 168, 0.6) 0%, rgba(168, 139, 235, 0.6) 100%);
            border-radius: 12px;
            transition: 0.2s;
            display: inline-block;
            margin: 6px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .support-btn a:hover {
            background: linear-gradient(135deg, rgba(255, 96, 168, 0.9) 0%, rgba(168, 139, 235, 0.9) 100%);
            transform: translateY(-1px);
        }

        /* 彈出視窗 (長按儲存圖片) */
        #preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            padding: 20px;
        }

        #preview-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--pink-glow);
            margin-bottom: 15px;
        }

        /* 右側中間懸浮關閉按鈕 */
        .floating-close-btn {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #ffffff;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .floating-close-btn:hover {
            background: var(--pink-glow);
            color: #100d21;
            border-color: var(--pink-glow);
            transform: translateY(-50%) scale(1.1);
        }

        .close-bottom-link {
            color: #ffffff;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .save-tip {
            color: var(--pink-glow);
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>💖放過自己、愛自己💖<br><span style="font-size:1.2rem; font-weight:normal;">提醒小卡生產器</span></h1>

    <!-- 姓名欄位 -->
    <div class="input-group">
        <label for="name-input">姓名：</label>
        <input type="text" id="name-input" placeholder="請輸入你的名字或暱稱">
    </div>

    <!-- 人稱單選欄位 -->
    <div class="input-group">
        <label>想被稱呼為：</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="gender-pronoun" value="你" checked> 你
            </label>
            <label class="radio-label">
                <input type="radio" name="gender-pronoun" value="妳"> 妳
            </label>
        </div>
    </div>

    <!-- 缺點輸入欄位 (改為長文字區塊，不帶提示字) -->
    <div class="input-group">
        <label for="flaw-input">寫下你覺得自己做得不夠好的部分或是世俗認為的「缺點」：</label>
        <div class="sub-label">例如：錢賺很少、很懶惰、沒耐心、喜歡耍廢</div>
        <textarea id="flaw-input"></textarea>
    </div>

    <button class="btn-submit" onclick="generateCard()">✨ 一鍵生成愛自己小卡 ✨</button>

    <!-- 生成的小卡區塊 -->
    <div id="card-capture">
        <div class="card-content" id="card-text"></div>
        <div class="card-praise" id="card-praise-text"></div>
        
        <div class="card-img-box">
            <img src="inner-self.jpg" alt="高我、內在小孩與地球小我">
            <div class="card-img-caption" id="card-img-title">的高我、內在小孩與地球小我♥︎</div>
        </div>
    </div>

    <!-- 生成分享圖片按鈕 -->
    <div class="download-action-box" id="download-action-box" style="display:none;">
        <button class="btn-generate-image" onclick="createImagePreview()">📸 生成分享圖片</button>
    </div>

    <!-- 社群連結 -->
    <div class="social-links">
        <a href="https://www.facebook.com/dorakatemon/" target="_blank">💙 凱特的FB</a>
        <a href="https://www.instagram.com/katesuncourse/" target="_blank">🩷 凱特的IG</a>
        <a href="https://www.youtube.com/@katesungoodlife" target="_blank">❤️ 凱特的YouTube</a>
    </div>

    <!-- 捐款支持連結 -->
    <div class="support-btn">
        <a href="https://p.ecpay.com.tw/C887CAB" target="_blank">☕ 台灣隨喜支持</a>
        <a href="javascript:void(0)" onclick="goToPaypal()">🌎 海外隨喜支持</a>
    </div>
</div>

<!-- 圖片預覽彈窗 -->
<div id="preview-overlay">
    <!-- 右側中間懸浮關閉按鈕 ✕ -->
    <div class="floating-close-btn" onclick="closePreview()" title="關閉視窗">✕</div>

    <div class="save-tip">✨ 請長按圖片選擇「儲存至相片」</div>
    <img id="preview-image" src="" alt="提醒小卡">
    <div class="close-bottom-link" onclick="closePreview()">← 返回修改內容</div>
</div>

<script>
    let globalName = "";

    function generateCard() {
        globalName = document.getElementById('name-input').value.trim() || "親愛的";
        const flaw = document.getElementById('flaw-input').value.trim();
        
        // 取得選擇的人稱 (你 / 妳)
        const selectedPronoun = document.querySelector('input[name="gender-pronoun"]:checked').value;
        const thirdPerson = (selectedPronoun === "妳") ? "她" : "他";
        const secondPerson = selectedPronoun;

        // 缺點內容邏輯
        const flawDisplay = flaw ? flaw : "偶爾有些缺點";

        // 卡片主要內容與換行設定
        const cardText = `${globalName}${flawDisplay}<br>也沒關係、<br>就是體驗而已<br>` +
                         `本質的${globalName}是宇宙的源頭、<br>` +
                         `是無條件的愛<br>` +
                         `這一切都是為了${globalName}最好最理想的體驗<br>` +
                         `讓${globalName}感受到萬事萬物對${thirdPerson}無條件的愛<br>` +
                         `謝謝${secondPerson}、我愛${secondPerson}💖`;

        const praiseText = `${globalName}、${secondPerson}怎麼這麼棒<br>` +
                           `全世界最棒的人是誰<br>` +
                           `就是${secondPerson}！<br>` +
                           `我太愛${secondPerson}了～`;

        document.getElementById('card-text').innerHTML = cardText;
        document.getElementById('card-praise-text').innerHTML = praiseText;
        
        // 更新圖片下方標題
        document.getElementById('card-img-title').innerText = `${globalName}的高我、內在小孩與地球小我♥︎`;

        const cardArea = document.getElementById('card-capture');
        cardArea.style.display = 'block';
        
        document.getElementById('download-action-box').style.display = 'block';

        // 平滑捲動至圖卡
        cardArea.scrollIntoView({ behavior: 'smooth' });
    }

    function createImagePreview() {
        const target = document.getElementById('card-capture');
        const btn = document.querySelector('.btn-generate-image');
        btn.innerText = "⏳ 圖片生成中...";

        html2canvas(target, {
            useCORS: true,
            scale: 3,
            backgroundColor: "#100d21",
            logging: false
        }).then(canvas => {
            const previewOverlay = document.getElementById('preview-overlay');
            const previewImage = document.getElementById('preview-image');
            previewImage.src = canvas.toDataURL('image/png');
            previewOverlay.style.display = 'flex';
            btn.innerText = "📸 生成分享圖片";
        }).catch(err => {
            alert("生成圖片失敗，請稍後再試！");
            btn.innerText = "📸 生成分享圖片";
        });
    }

    function closePreview() {
        document.getElementById('preview-overlay').style.display = 'none';
    }

    function goToPaypal() {
        const user = "s9413494134";
        const domain = "@gmail.com";
        const url = "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=" + user + domain + "&item_name=KateSunLoveCard&currency_code=USD";
        window.open(url, '_blank');
    }
</script>

</body>
</html>
